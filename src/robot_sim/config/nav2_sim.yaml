# Nav2 参数 —— robot_sim 无实物仿真
# 特点:无 AMCL/map_server(仿真里 odom 无误差,map≈odom,
#       map->odom 由 robot_sim.launch.py 的静态 TF 提供)
# 全局地图:直接订阅 mock_mapper 发布的 /map(latched)
# 局部避障:订阅 /livox/lidar 实时点云

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    goal_checker_plugins: ["goal_checker"]
    # DWB 全向控制器:四轮四转底盘可直接执行 x/y/yaw
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      motion_model: "omni"          # 全向运动模型
      min_vel_x: -1.5
      max_vel_x: 1.5
      min_vel_y: -1.5
      max_vel_y: 1.5
      max_vel_theta: 2.0
      min_speed_xy: 0.0
      max_speed_xy: 1.5
      min_speed_theta: 0.0
      acc_lim_x: 4.0
      acc_lim_y: 4.0
      acc_lim_theta: 6.0
      decel_lim_x: -4.0
      decel_lim_y: -4.0
      decel_lim_theta: -6.0
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      step_size: 0.15
      prune_plan: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower/WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      track_unknown_space: false   # 未观测格按自由处理,避免渲染成误导性的"假障碍区"
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.25
        z_voxels: 8
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: livox
        livox:
          topic: /cloud_body_filtered   # 去重后的实时点云(原/livox/lidar已改CustomMsg)
          sensor_frame: base_footprint
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          obstacle_max_range: 4.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.7
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.35
      width: 44          # 覆盖整张 44m x 44m 地图(与 map_manager GRID_HALF*2 一致)
      height: 44
      origin_x: -22.0    # 与地图 origin 对齐
      origin_y: -22.0
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /nav_map                    # 导航专用:map_manager 发布的存档图
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: livox
        livox:
          topic: /cloud_body_filtered   # 去重后的实时点云(原/livox/lidar已改CustomMsg)
          sensor_frame: base_footprint
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          obstacle_max_range: 4.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.7
      always_send_full_costmap: true

lifecycle_manager:
  ros__parameters:
    autostart: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server", "planner_server",
                 "behavior_server", "bt_navigator", "waypoint_follower"]
